<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<title>AI答疑助手</title>
<style>
*{box-sizing:border-box;}
body{max-width:900px;margin:2rem auto;padding:0 1rem;font-family:system-ui;}
#question{width:100%;height:80px;padding:8px;font-size:14px;}
#askBtn{margin-top:8px;padding:8px 16px;cursor:pointer;}
#result{margin-top:16px;padding:12px;border:1px solid #ccc;min-height:60px;}
#history{margin-top:24px;padding:12px;border:1px solid #aaa;}
</style>
</head>
<body>
<h2>AI答疑助手</h2>
<textarea id="question" placeholder="请输入你的问题" data-testid="ask-input"></textarea>
<br>
<button id="askBtn" data-testid="ask-button">提交提问</button>

<div id="result" data-testid="answer-panel">
    <div id="answer" data-testid="answer-text"></div>
    <div data-testid="answer-meta"></div>
</div>

<h3>历史提问记录</h3>
<div id="history" data-testid="history-list"></div>

<script src="./app.js"></script>
</body>
</html>
